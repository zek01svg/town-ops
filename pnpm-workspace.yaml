packages:
  - "apps/**"
  - "packages/**"
# `packages/ui` declares @tanstack/react-query as a peer (`>=5`), which pnpm
# auto-installs — resolving it to a newer patch than the catalog pin the apps
# use. That put two copies of @tanstack/query-core in the tree, so the
# `QueryClient` from `@townops/ui`'s `getQueryClient()` was a structurally
# different type from the one each app's `QueryClientProvider` expects, and
# `tsc` (which runs inside every frontend `build`, and so inside CI) failed.
# Same class of hazard as the React dedupe every Vite config already carries.
overrides:
  "@tanstack/react-query": 5.101.2
  "@tanstack/react-query-devtools": 5.101.2
  "@tanstack/react-router": 1.170.18

allowBuilds:
  "@swc/core": false
  cpu-features: false
  esbuild: false
  lefthook: false
  protobufjs: false
  ssh2: false

